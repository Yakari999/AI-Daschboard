<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mon tableau de bord IA</title>
<style>
  :root {
    --bg: #f4f5fa;
    --surface: #ffffff;
    --surface-2: #eef0f7;
    --border: #e1e3ee;
    --text: #191b26;
    --text-muted: #6a6f85;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-soft: #eef0ff;
    --danger: #e4574c;
    --shadow: 0 1px 2px rgba(20,20,40,.04), 0 8px 24px rgba(20,20,40,.06);
    --shadow-hover: 0 4px 10px rgba(20,20,40,.06), 0 16px 32px rgba(20,20,40,.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f16;
      --surface: #171922;
      --surface-2: #1e212c;
      --border: #2a2d3a;
      --text: #edeef5;
      --text-muted: #9296ab;
      --accent: #818cf8;
      --accent-2: #a78bfa;
      --accent-soft: #23253a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-hover: 0 4px 10px rgba(0,0,0,.35), 0 16px 32px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f16;
    --surface: #171922;
    --surface-2: #1e212c;
    --border: #2a2d3a;
    --text: #edeef5;
    --text-muted: #9296ab;
    --accent: #818cf8;
    --accent-2: #a78bfa;
    --accent-soft: #23253a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-hover: 0 4px 10px rgba(0,0,0,.35), 0 16px 32px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px clamp(16px, 4vw, 40px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    z-index: 20;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand p { margin: 0; font-size: .8rem; color: var(--text-muted); }

  .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-size: 16px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .icon-btn:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  .icon-btn:disabled:hover { box-shadow: none; transform: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .board-toolbar {
    display: none; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 12px clamp(16px, 4vw, 40px) 0;
  }
  .board-toolbar.visible { display: flex; }
  .search-bar { flex-shrink: 0; }
  .search-bar input {
    font: inherit; background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px; color: var(--text); width: 220px; max-width: 100%;
  }
  .search-bar input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tag-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; }
  .scroll-controls { display: flex; gap: 8px; flex-shrink: 0; }
  .tag-pill {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    border-radius: 999px; padding: 5px 12px; font-size: .74rem; font-weight: 600; cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tag-pill:hover { border-color: var(--accent); color: var(--accent); }
  .tag-pill.active { background: var(--accent); color: white; border-color: var(--accent); }
  .column-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .column-tag {
    font-size: .64rem; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-muted);
  }

  main.board {
    display: flex;
    gap: 18px;
    padding: 14px clamp(16px, 4vw, 40px) 60px;
    overflow-x: auto;
    align-items: flex-start;
    min-height: calc(100vh - 90px);
    scroll-behavior: smooth;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 320px;
    flex: 0 0 320px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 130px);
    transition: outline-color .15s ease, opacity .15s ease;
    outline: 2px solid transparent;
    outline-offset: -2px;
  }
  .column-head[draggable="true"] { cursor: grab; }
  .column-head[draggable="true"]:active { cursor: grabbing; }
  .column.dragging { opacity: .4; }
  .column.drag-over { outline-color: var(--accent); }
  .column-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
  .column-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .column-title {
    font-size: 1rem; font-weight: 700; margin: 0; word-break: break-word;
  }
  .column-menu { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .column-menu .mini-btn:nth-child(2) { margin-right: 4px; }
  .mini-btn {
    width: 26px; height: 26px; border-radius: 8px; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .mini-btn svg { width: 14px; height: 14px; }
  .mini-btn:hover { background: var(--surface-2); color: var(--text); }
  .mini-btn.danger:hover { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .mini-btn:disabled { opacity: .3; cursor: not-allowed; }
  .mini-btn:disabled:hover { background: transparent; color: var(--text-muted); }

  .column-prompt {
    margin: 8px 0 0;
    font-size: .78rem;
    color: var(--text-muted);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .column-meta {
    margin-top: 10px; display: flex; align-items: center; justify-content: space-between;
    font-size: .7rem; color: var(--text-muted);
  }
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); border-radius: 999px; padding: 4px 10px;
    font-size: .72rem; cursor: pointer; transition: background .15s ease;
  }
  .refresh-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .column-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }

  .tile {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    display: block;
    flex-shrink: 0;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .tile-media {
    width: 100%; object-fit: cover; display: block; background: var(--surface); overflow: hidden;
  }
  img.tile-media { aspect-ratio: 16/9; }
  .tile-media.placeholder {
    height: 150px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; line-height: 1;
    background: linear-gradient(135deg, var(--accent-soft), var(--surface-2));
  }
  .tile-media-wrap { position: relative; }
  .new-badge {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    background: var(--accent); color: #fff; font-size: .62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; padding: 3px 9px; border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .tile-body { padding: 12px; }
  .tile-title { font-size: .86rem; font-weight: 650; margin: 0 0 4px; line-height: 1.3; }
  .tile-summary {
    font-size: .76rem; color: var(--text-muted); margin: 0; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tile-summary-long { -webkit-line-clamp: 7; }
  .tile-footer { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .type-badge {
    font-size: .65rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  }
  .tile-date { font-size: .68rem; color: var(--text-muted); }

  .empty-tile { font-size: .78rem; color: var(--text-muted); padding: 20px 4px; text-align: center; }

  .column-list { padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; }
  .list-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; text-decoration: none; color: var(--text);
    transition: background .15s ease, color .15s ease;
  }
  a.list-item:hover { background: var(--accent-soft); color: var(--accent); }
  .list-item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .list-item-name { font-size: .84rem; font-weight: 550; }
  .list-item-date { font-size: .68rem; color: var(--text-muted); }
  .list-item-badge {
    background: var(--accent); color: #fff; font-size: .6rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
  }

  .tile.tile-seen { opacity: .5; }
  a.tile.tile-seen:hover { opacity: .85; }
  a.list-item.list-item-seen { opacity: .5; }
  a.list-item.list-item-seen:hover { opacity: .85; }

  /* ---- Compact mode ---- */
  body.compact main.board { gap: 12px; }
  body.compact .column { width: 230px; flex-basis: 230px; }
  body.compact .column-head { padding: 10px 10px 8px; }
  body.compact .column-title { font-size: .86rem; }
  body.compact .column-prompt { -webkit-line-clamp: 1; margin: 4px 0 0; }
  body.compact .column-body { padding: 8px; gap: 8px; }
  body.compact .tile-media.placeholder { height: 80px; font-size: 1.2rem; }
  body.compact .tile-body { padding: 8px; }
  body.compact .tile-title { font-size: .78rem; }
  body.compact .tile-summary { font-size: .7rem; -webkit-line-clamp: 2; }
  body.compact .tile-summary-long { -webkit-line-clamp: 3; }
  body.compact .tile-footer { margin-top: 4px; }

  .column.add-column {
    background: transparent;
    border: 2px dashed var(--border);
    box-shadow: none;
    align-items: center;
    justify-content: center;
    display: flex;
    min-height: 120px;
    cursor: pointer;
  }
  .column.add-column:hover { border-color: var(--accent); color: var(--accent); }
  .add-column span { font-weight: 600; font-size: .9rem; color: inherit; }

  .form-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .form-field label { font-size: .72rem; color: var(--text-muted); font-weight: 600; }
  .form-field input, .form-field textarea, .form-field select {
    font: inherit; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; color: var(--text); resize: vertical;
  }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .form-field-row { display: flex; gap: 10px; }
  .form-field-row .form-field { flex: 1; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

  .btn {
    font: inherit; border: none; border-radius: 10px; padding: 8px 14px;
    cursor: pointer; font-weight: 600; font-size: .82rem;
  }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: white; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .backdrop {
    position: fixed; inset: 0; background: rgba(10,10,20,.45);
    display: none; align-items: flex-start; justify-content: flex-end; z-index: 50;
  }
  .backdrop.open { display: flex; }
  .panel {
    width: min(340px, 92vw); background: var(--surface); height: 100%;
    border-left: 1px solid var(--border); padding: 20px; box-shadow: var(--shadow-hover);
  }
  .panel h2 { margin: 0 0 6px; font-size: 1.05rem; }
  .panel p.hint { font-size: .78rem; color: var(--text-muted); line-height: 1.5; }

  .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: .82rem; box-shadow: var(--shadow-hover); max-width: 360px; text-align: center;
  }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .status-dot.ro { background: var(--text-muted); }
  .status-dot.rw { background: #22c55e; }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Mon tableau de bord IA</h1>
      <p id="statusLine"><span class="status-dot ro"></span>Lecture seule — configure ton accès pour éditer</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="compactToggle" title="Mode compact">▦</button>
      <button class="icon-btn" id="themeToggle" title="Changer le thème"></button>
      <button class="icon-btn" id="settingsBtn" title="Réglages">⚙️</button>
    </div>
  </header>

  <div class="board-toolbar" id="boardToolbar">
    <div class="search-bar">
      <input type="search" id="searchInput" placeholder="Rechercher dans les résultats..." />
    </div>
    <div class="tag-filter-bar" id="tagFilterBar"></div>
    <div class="scroll-controls" id="scrollControls">
      <button class="icon-btn" id="scrollLeftBtn" title="Défiler vers la gauche">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="icon-btn" id="scrollRightBtn" title="Défiler vers la droite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <main class="board" id="board">
    <!-- columns injected by JS -->
  </main>

  <div class="backdrop" id="settingsBackdrop">
    <div class="panel">
      <h2>Réglages</h2>
      <p class="hint">
        Pour ajouter, modifier ou supprimer des colonnes directement depuis cette page,
        renseigne un jeton d'accès personnel GitHub (scope <code>repo</code>) pour
        <strong>yakari999/ai-daschboard</strong>. Il reste stocké uniquement dans ton navigateur.
      </p>
      <div class="form-field">
        <label for="ghOwner">Propriétaire</label>
        <input id="ghOwner" value="yakari999" />
      </div>
      <div class="form-field">
        <label for="ghRepo">Dépôt</label>
        <input id="ghRepo" value="ai-daschboard" />
      </div>
      <div class="form-field">
        <label for="ghBranch">Branche</label>
        <input id="ghBranch" value="main" />
      </div>
      <div class="form-field">
        <label for="ghToken">Jeton d'accès personnel</label>
        <input id="ghToken" type="password" placeholder="ghp_..." />
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="ghClear">Effacer</button>
        <button class="btn btn-primary" id="ghSave">Enregistrer</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

<script src="app.js?v=15"></script>
</body>
</html>
